name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Eklenti tarayıcıda çalışıyor; burada denetlenen çekirdek mantık.
        # Eski LTS de tutulsun ki kullanılan söz dizimi gereksiz yenilenmesin.
        node: ['20', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # Bağımlılık yok (node:test ile çalışıyor), npm ci'ye gerek de yok.
      - name: Eklenti bütünlüğü
        run: npm run check

      - name: Testler
        run: npm test
